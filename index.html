<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trailmarks — Learn Something Great</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF7EF;
  --paper-deep:#F3EDDF;
  --ink:#1E2A47;
  --ink-soft:#5A6480;
  --math:#3F7FFC;
  --math-dark:#2C5FD1;
  --math-tint:#E9F0FF;
  --read:#E8557A;
  --read-dark:#C13B60;
  --read-tint:#FCEAEF;
  --math3:#1FAE8C;
  --math3-dark:#128468;
  --math3-tint:#E4F6F1;
  --math4:#8B5CF6;
  --math4-dark:#6D3FD1;
  --math4-tint:#F1EBFF;
  --sun:#FFC53D;
  --leaf:#2FB380;
  --leaf-dark:#1F8F64;
  --wrong:#FF6B5E;
  --card:#FFFFFF;
  --line:#E4DCC8;
  --radius:20px;
  --shadow:0 6px 0 rgba(30,42,71,0.08), 0 12px 24px rgba(30,42,71,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Atkinson Hyperlegible',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
button{font-family:inherit;cursor:pointer;}
.wrap{max-width:900px;margin:0 auto;padding:0 20px;}

/* header */
.site-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;max-width:900px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:var(--ink);background:none;border:none;padding:0;}
.brand svg{display:block;}
.stat-pill{
  display:flex;align-items:center;gap:6px;background:var(--card);
  border:2px solid var(--line);border-radius:999px;padding:6px 14px;
  font-weight:700;font-size:15px;box-shadow:var(--shadow);
}
.stat-pill .n{color:var(--ink);}

main{padding-bottom:60px;}

/* buttons */
.btn{
  border:none;border-radius:14px;padding:14px 26px;font-weight:800;font-size:16px;
  font-family:'Baloo 2',sans-serif;letter-spacing:.2px;transition:transform .08s ease, filter .15s;
}
.btn:active{transform:translateY(2px);}
.btn-math{background:var(--math);color:#fff;box-shadow:0 5px 0 var(--math-dark);}
.btn-math:active{box-shadow:0 2px 0 var(--math-dark);}
.btn-read{background:var(--read);color:#fff;box-shadow:0 5px 0 var(--read-dark);}
.btn-read:active{box-shadow:0 2px 0 var(--read-dark);}
.btn-math3{background:var(--math3);color:#fff;box-shadow:0 5px 0 var(--math3-dark);}
.btn-math3:active{box-shadow:0 2px 0 var(--math3-dark);}
.btn-math4{background:var(--math4);color:#fff;box-shadow:0 5px 0 var(--math4-dark);}
.btn-math4:active{box-shadow:0 2px 0 var(--math4-dark);}
.btn-leaf{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-dark);}
.btn-leaf:active{box-shadow:0 2px 0 var(--leaf-dark);}
.btn-ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;}

.backlink{
  display:inline-flex;align-items:center;gap:6px;background:none;border:none;
  color:var(--ink-soft);font-weight:700;font-size:15px;padding:8px 0;margin-bottom:6px;
}
.backlink:hover{color:var(--ink);}

/* HOME */
.hero{padding:36px 20px 10px;max-width:900px;margin:0 auto;text-align:center;}
.hero h1{font-size:clamp(30px,5vw,44px);margin:0 0 10px;line-height:1.1;}
.hero p{color:var(--ink-soft);font-size:18px;margin:0 auto;max-width:520px;}
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:920px;margin:34px auto 0;padding:0 20px;}
@media (max-width:680px){.course-grid{grid-template-columns:1fr;}}
.course-card{
  background:var(--card);border-radius:24px;padding:26px;box-shadow:var(--shadow);
  border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden;
}
.course-card::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;opacity:.14;}
.course-card.math::after{background:var(--math);}
.course-card.read::after{background:var(--read);}
.course-card.math3::after{background:var(--math3);}
.course-card.math4::after{background:var(--math4);}
.course-badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-family:'Baloo 2',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding:5px 12px;border-radius:999px;width:fit-content;}
.course-card.math .course-badge{background:var(--math-tint);color:var(--math-dark);}
.course-card.read .course-badge{background:var(--read-tint);color:var(--read-dark);}
.course-card.math3 .course-badge{background:var(--math3-tint);color:var(--math3-dark);}
.course-card.math4 .course-badge{background:var(--math4-tint);color:var(--math4-dark);}
.course-illustration{display:flex;align-items:center;height:70px;}
.course-card h2{margin:0;font-size:24px;}
.course-card p.desc{color:var(--ink-soft);margin:0;font-size:15px;line-height:1.5;}
.progress-track{background:var(--paper-deep);border-radius:999px;height:12px;overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;transition:width .4s ease;}
.course-card.math .progress-fill{background:var(--math);}
.course-card.read .progress-fill{background:var(--read);}
.course-card.math3 .progress-fill{background:var(--math3);}
.course-card.math4 .progress-fill{background:var(--math4);}
.progress-label{font-size:13px;color:var(--ink-soft);font-weight:700;}

/* COURSE PAGE */
.course-head{padding:20px 20px 6px;max-width:900px;margin:0 auto;}
.course-head h1{font-size:30px;margin:6px 0 4px;}
.course-head .sub{color:var(--ink-soft);margin:0 0 6px;}
.course-progress-bar{max-width:900px;margin:0 auto 10px;padding:0 20px;}

.unit{max-width:640px;margin:38px auto 0;padding:0 20px;}
.unit-title{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.unit-num{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;color:#fff;flex:none;font-size:15px;
}
.unit-title h3{margin:0;font-size:20px;}
.unit-desc{color:var(--ink-soft);font-size:14px;margin:0 0 18px 46px;}

.trail{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0 6px;}
.trail-line{position:absolute;top:6px;bottom:6px;left:50%;width:0;border-left:4px dashed var(--line);transform:translateX(-50%);z-index:0;}
.trail-node-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.node-btn{
  width:74px;height:74px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:#fff;position:relative;
  box-shadow:var(--shadow);transition:transform .1s ease;
}
.node-btn:active{transform:scale(.95);}
.node-btn.locked{background:#D8D2C2;color:#a49d89;box-shadow:none;cursor:not-allowed;}
.node-btn.available.math{background:var(--math);box-shadow:0 5px 0 var(--math-dark);}
.node-btn.available.read{background:var(--read);box-shadow:0 5px 0 var(--read-dark);}
.node-btn.completed{background:var(--sun);color:#7a5300;box-shadow:0 5px 0 #d9a11f;}
.node-label{font-size:13px;font-weight:700;color:var(--ink-soft);text-align:center;max-width:130px;}
.node-stars{display:flex;gap:2px;}
.node-stars svg{width:12px;height:12px;}

/* UNIT INTRO */
.unit-intro-box{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
.unit-eyebrow{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 6px;}
.unit-intro-box h2{margin:0 0 12px;font-size:26px;}
.unit-intro-box .overview-text{font-size:17px;line-height:1.65;margin:0 0 20px;}
.objective-list{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:10px;}
.objective-list li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.5;}
.objective-list .check-badge{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-top:1px;}
.lesson-preview{display:flex;flex-direction:column;gap:6px;margin:0 0 22px;padding:14px 16px;background:var(--paper-deep);border-radius:12px;}
.lesson-preview .lp-row{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink-soft);}
.lesson-preview .lp-num{font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--ink);}

/* NODE variants for intro/test */
.node-btn.squarish{border-radius:20px;}

/* EXAM BANNER */
.exam-banner{
  max-width:640px;margin:34px auto 0;padding:0 20px;
}
.exam-banner-inner{
  background:linear-gradient(135deg,#2C2A3A,#3A3652);color:#fff;border-radius:22px;padding:24px 26px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;position:relative;overflow:hidden;
}
.exam-banner-inner.locked{background:#E4DCC8;color:#8b8368;box-shadow:none;}
.exam-icon{flex:none;width:52px;height:52px;border-radius:50%;background:var(--sun);display:flex;align-items:center;justify-content:center;font-size:24px;}
.exam-banner-inner.locked .exam-icon{background:#c9c1ac;}
.exam-text{flex:1;min-width:0;}
.exam-text .exam-eyebrow{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;margin:0 0 2px;}
.exam-text h3{margin:0 0 4px;font-size:19px;font-family:'Baloo 2',sans-serif;}
.exam-text p{margin:0;font-size:13.5px;opacity:.85;}
.exam-stars{display:flex;gap:2px;margin-top:6px;}
.exam-stars svg{width:14px;height:14px;}
.exam-banner-inner button{flex:none;}

/* COURSE SHELL (sidebar layout) */
.course-shell{display:flex;max-width:1100px;margin:0 auto;gap:0;align-items:flex-start;}
.course-sidebar{width:250px;flex:none;padding:20px 12px 40px;border-right:2px solid var(--line);position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto;}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
.sidebar-head .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;flex:none;}
.sidebar-head .txt strong{display:block;font-size:14.5px;line-height:1.3;}
.sidebar-head .txt span{font-size:11.5px;color:var(--ink-soft);}
.side-item{display:block;width:100%;text-align:left;background:none;border:none;border-radius:10px;padding:10px 10px;margin-bottom:2px;}
.side-item .si-eyebrow{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
.side-item .si-title{font-size:14px;font-weight:700;color:var(--ink);}
.side-item.active{background:var(--paper-deep);}
.side-item.exam{border-top:1px dashed var(--line);border-radius:0;padding-top:12px;margin-top:8px;}
.course-main{flex:1;min-width:0;padding:24px 32px 60px;}
@media (max-width:800px){
  .course-shell{flex-direction:column;}
  .course-sidebar{width:100%;position:static;border-right:none;border-bottom:2px solid var(--line);display:flex;overflow-x:auto;gap:4px;max-height:none;}
  .sidebar-head{display:none;}
  .side-item{flex:none;width:auto;white-space:nowrap;border-top:none !important;margin-top:0 !important;}
  .course-main{padding:20px;}
}

.unit-page-head{margin-bottom:6px;}
.unit-page-head .eyebrow{font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;}
.unit-page-head h1{font-size:27px;margin:0 0 6px;}
.unit-page-head .possible{font-size:13.5px;color:var(--ink-soft);margin:0;}

.squares-row{display:flex;align-items:center;gap:8px;margin:16px 0 24px;flex-wrap:wrap;}
.sq-node{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff;color:var(--ink-soft);font-weight:700;}
.sq-node.done{background:var(--leaf);border-color:var(--leaf-dark);color:#fff;}
.sq-node.star{border-radius:50%;}
.sq-node.star.done{background:var(--sun);border-color:#d9a11f;color:#7a5300;}

.about-unit{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:26px;}
.about-unit h3{margin:0 0 8px;font-size:15px;font-family:'Baloo 2',sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
.about-unit p{margin:0 0 14px;font-size:15.5px;line-height:1.65;color:var(--ink);}
.about-unit .objective-list{margin:0;}

.lesson-row{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;}
.lesson-row .lr-icon{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;color:#fff;font-size:16px;}
.lesson-row.test .lr-icon{border-radius:12px;background:var(--sun);color:#7a5300;}
.lesson-row .lr-body{flex:1;min-width:0;}
.lesson-row .lr-title{font-weight:700;font-size:15.5px;margin:0 0 2px;}
.lesson-row .lr-status{font-size:13px;color:var(--ink-soft);margin:0;}
.lesson-row .lr-stars{display:flex;gap:2px;margin-top:4px;}
.lesson-row .lr-stars svg{width:12px;height:12px;}
.lesson-row .lr-action{flex:none;}
.lesson-row.locked{opacity:.55;}
.btn-small{padding:9px 16px;font-size:14px;}

.exam-page-card{background:linear-gradient(135deg,#2C2A3A,#3A3652);color:#fff;border-radius:22px;padding:36px 30px;text-align:center;max-width:520px;margin:10px auto 0;}
.exam-page-card.locked{background:#E4DCC8;color:#8b8368;}
.exam-page-card .exam-icon-big{width:64px;height:64px;border-radius:50%;background:var(--sun);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
.exam-page-card.locked .exam-icon-big{background:#c9c1ac;}
.exam-page-card h1{margin:0 0 6px;font-size:24px;}
.exam-page-card p{margin:0 0 18px;opacity:.85;font-size:14.5px;}

.lesson-meta{font-size:12.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px;}
.lesson-objective{background:var(--paper-deep);border-radius:10px;padding:10px 14px;font-size:14.5px;margin:10px 0 18px;}

/* LESSON TEACH */
.lesson-card{max-width:640px;margin:20px auto;padding:0 20px;}
.teach-box{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
.teach-box h2{margin:0 0 10px;font-size:26px;}
.teach-box .teach-text{font-size:17px;line-height:1.65;color:var(--ink);}
.teach-visual{margin:18px 0;display:flex;justify-content:center;}
.example-box{background:var(--paper-deep);border-radius:14px;padding:16px 18px;margin-top:14px;font-size:15px;}
.example-box b{font-family:'Baloo 2',sans-serif;}

/* PRACTICE */
.practice-wrap{max-width:640px;margin:16px auto;padding:0 20px;}
.progress-dots{display:flex;gap:8px;justify-content:center;margin-bottom:22px;}
.progress-dots .dot{width:34px;height:8px;border-radius:5px;background:var(--line);}
.progress-dots .dot.done-correct{background:var(--leaf);}
.progress-dots .dot.done-wrong{background:var(--wrong);}
.progress-dots .dot.current{background:var(--ink-soft);}
.q-card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
.q-prompt{font-size:20px;font-weight:700;margin:0 0 6px;line-height:1.4;}
.q-passage{background:var(--paper-deep);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.6;margin-bottom:14px;}
.q-visual{display:flex;justify-content:center;margin:14px 0;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
@media (max-width:520px){.choices{grid-template-columns:1fr;}}
.choice-btn{
  background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;
  font-size:16px;font-weight:700;text-align:left;color:var(--ink);transition:.12s;
}
.choice-btn:hover:not(:disabled){border-color:var(--ink-soft);}
.choice-btn.correct{background:#EAF9F1;border-color:var(--leaf);color:var(--leaf-dark);}
.choice-btn.wrong{background:#FFEFED;border-color:var(--wrong);color:#B8392E;}
.choice-btn:disabled{cursor:default;}
.feedback-bar{
  display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 16px;border-radius:14px;
  font-weight:700;font-size:15px;
}
.feedback-bar.good{background:#EAF9F1;color:var(--leaf-dark);}
.feedback-bar.bad{background:#FFEFED;color:#B8392E;}
.mascot{width:40px;height:40px;flex:none;}
.practice-footer{display:flex;justify-content:flex-end;margin-top:18px;}

/* RESULT */
.result-wrap{max-width:520px;margin:60px auto;padding:0 20px;text-align:center;}
.result-stars{display:flex;justify-content:center;gap:14px;margin:20px 0;}
.result-stars svg{width:56px;height:56px;}
.result-title{font-size:28px;margin:0 0 6px;}
.result-sub{color:var(--ink-soft);font-size:16px;margin:0 0 26px;}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
:focus-visible{outline:3px solid var(--math);outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
</style>
</head>
<body>
<header class="site-header">
  <button class="brand" id="logoBtn" aria-label="Go to home">
    <svg width="30" height="30" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#FFC53D"/><path d="M20 6 L23.5 16.5 L34.5 16.5 L25.5 23 L29 33.5 L20 27 L11 33.5 L14.5 23 L5.5 16.5 L16.5 16.5 Z" fill="#1E2A47"/></svg>
    Trailmarks
  </button>
  <div class="stat-pill" id="starPill" aria-live="polite">
    <svg width="18" height="18" viewBox="0 0 20 20"><path d="M10 1 L12.6 7 L19 7.6 L14 12 L15.5 18.5 L10 15 L4.5 18.5 L6 12 L1 7.6 L7.4 7 Z" fill="#FFC53D"/></svg>
    <span class="n" id="starCount">0</span>
  </div>
</header>
<main id="app"></main>

<script>
/* ---------------------------------------------------------------
   UTILITIES
--------------------------------------------------------------- */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(arr){return arr[randInt(0,arr.length-1)];}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildChoices(correctLabel, distractors){
  const pool=[correctLabel, ...distractors.filter(d=>String(d)!==String(correctLabel))];
  const uniq=[...new Set(pool.map(String))].slice(0,4);
  if(!uniq.includes(String(correctLabel))) uniq[0]=String(correctLabel);
  return shuffle(uniq).map(label=>({label, correct:String(label)===String(correctLabel)}));
}
function uniqueQuestions(genFn,count){
  const out=[]; const seen=new Set(); let tries=0;
  while(out.length<count && tries<200){
    tries++;
    const q=genFn();
    const key=q.prompt;
    if(!seen.has(key)){seen.add(key);out.push(q);}
  }
  return out;
}

/* ---------------------------------------------------------------
   SVG HELPERS (mascot, stars, clocks, shapes, dots, bars)
--------------------------------------------------------------- */
function starIcon(filled){
  return `<svg viewBox="0 0 20 20"><path d="M10 1 L12.6 7 L19 7.6 L14 12 L15.5 18.5 L10 15 L4.5 18.5 L6 12 L1 7.6 L7.4 7 Z" fill="${filled?'#FFC53D':'#E4DCC8'}"/></svg>`;
}
function mascotSVG(mood){
  // mood: 'happy' | 'sad' | 'neutral'
  const mouth = mood==='happy' ? '<path d="M13 24 Q20 30 27 24" stroke="#1E2A47" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
              : mood==='sad' ? '<path d="M13 27 Q20 22 27 27" stroke="#1E2A47" stroke-width="2.4" fill="none" stroke-linecap="round"/>'

function clockSVG(hour,minute){
  const cx=60,cy=60;
  function pt(angleDeg,len){const rad=(angleDeg-90)*Math.PI/180;return [cx+len*Math.cos(rad),cy+len*Math.sin(rad)];}
  const minuteAngle=(minute/60)*360;
  const hourAngle=((hour%12)/12)*360 + (minute/60)*30;
  const [mx,my]=pt(minuteAngle,42);
  const [hx,hy]=pt(hourAngle,26);
  let ticks='';
  for(let i=0;i<12;i++){
    const a=i*30;
    const [x1,y1]=pt(a,50), [x2,y2]=pt(a,44);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#1E2A47" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 120 120" width="160" height="160">
    <circle cx="60" cy="60" r="56" fill="#fff" stroke="#1E2A47" stroke-width="4"/>
    ${ticks}
    <line x1="60" y1="60" x2="${hx}" y2="${hy}" stroke="#1E2A47" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="${mx}" y2="${my}" stroke="#3F7FFC" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="4" fill="#1E2A47"/>
  </svg>`;
}
function polyPoints(sides,cx,cy,r){
  const pts=[];
  for(let i=0;i<sides;i++){
    const a=(i*(360/sides)-90)*Math.PI/180;
    pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');
}
function shapeSVG(name){

  let inner='';
  switch(name){
    case 'circle': inner=`<circle cx="50" cy="50" r="38" ${s}/>`; break;
    case 'square': inner=`<rect x="14" y="14" width="72" height="72" ${s}/>`; break;
    case 'rectangle': inner=`<rect x="6" y="26" width="88" height="48" ${s}/>`; break;
    case 'triangle': inner=`<polygon points="${polyPoints(3,50,52,42)}" ${s}/>`; break;
    case 'pentagon': inner=`<polygon points="${polyPoints(5,50,52,40)}" ${s}/>`; break;
    case 'hexagon': inner=`<polygon points="${polyPoints(6,50,50,40)}" ${s}/>`; break;
    case 'cube': inner=`<rect x="16" y="30" width="50" height="50" ${s}/><rect x="30" y="16" width="50" height="50" fill="#fff" stroke="#1E2A47" stroke-width="4"/><line x1="16" y1="30" x2="30" y2="16" stroke="#1E2A47" stroke-width="4"/><line x1="66" y1="30" x2="80" y2="16" stroke="#1E2A47" stroke-width="4"/><line x1="66" y1="80" x2="80" y2="66" stroke="#1E2A47" stroke-width="4"/>`; break;
    case 'sphere': inner=`<circle cx="50" cy="50" r="38" ${s}/><ellipse cx="50" cy="58" rx="30" ry="10" fill="none" stroke="#1E2A47" stroke-width="2" opacity=".5"/>`; break;
    case 'cone': inner=`<polygon points="50,10 20,80 80,80" ${s}/><ellipse cx="50" cy="80" rx="30" ry="9" fill="#E9F0FF" stroke="#1E2A47" stroke-width="4"/>`; break;
    default: inner=`<circle cx="50" cy="50" r="38" ${s}/>`;

function genPlaceValueBig(){

/* ---------------------------------------------------------------
   SCORING / ASSESSMENT GENERATORS
--------------------------------------------------------------- */
function starsForScore(correct,total){
  const pct = total===0 ? 0 : correct/total;
  if(pct>=0.9) return 3;
  if(pct>=0.75) return 2;
  if(pct>=0.5) return 1;
  return 0;
}
// Unit test: pulls 3 fresh questions from each lesson in the unit
function genUnitTest(courseId,ui){
  const unit=COURSES[courseId].units[ui];
  let qs=[];
  unit.lessons.forEach(les=>{ qs=qs.concat(les.gen(3)); });
  return shuffle(qs);
}

  const course=COURSES[courseId];
  let qs=[];
  for(let ui=0; ui<=uptoUnit; ui++){
    course.units[ui].lessons.forEach(les=>{ qs=qs.concat(les.gen(1)); });
  }
  return shuffle(qs);
}
const EXAM_META={
  mid:{ title:'Mid-Course Exam', uptoUnit:2, blurb:'Covers Units 1–3' },
  threequarter:{ title:'Three-Quarter Exam', uptoUnit:3, blurb:'Covers Units 1–4' },
  final:{ title:'Final Exam', uptoUnit:4, blurb:'Comprehensive — covers all 5 units' },
};

/* ---------------------------------------------------------------
   STATE
--------------------------------------------------------------- */
const state = {
  progress: {},      // nodeKey -> {stars, bestCorrect}
  view: {name:'home'},
  practice: null,
  courseFocus: {}    // courseId -> {type:'unit',u} | {type:'exam',exam}
};

function nodeKey(courseId,node){
  if(node.type==='lesson') return `${courseId}-u${node.u}-l${node.l}`;
  if(node.type==='test') return `${courseId}-u${node.u}-test`;
  return `${courseId}-exam-${node.exam}`;
}
function buildFlow(courseId){
  const course=COURSES[courseId];
  const flow=[];
  course.units.forEach((unit,ui)=>{
    unit.lessons.forEach((les,li)=>flow.push({type:'lesson',u:ui,l:li}));
    flow.push({type:'test',u:ui});
    if(ui===2) flow.push({type:'exam',exam:'mid'});
    if(ui===3) flow.push({type:'exam',exam:'threequarter'});
    if(ui===4) flow.push({type:'exam',exam:'final'});
  });
  return flow;
}
function flowIndexOf(flow,node){
  return flow.findIndex(n=>n.type===node.type && n.u===node.u && n.l===node.l && n.exam===node.exam);
}
function nodeCompleted(courseId,node){ return !!state.progress[nodeKey(courseId,node)]; }
function nodeUnlockedAt(flow,idx,courseId){ return idx===0 ? true : nodeCompleted(courseId,flow[idx-1]); }
function totalStars(courseId){
  const flow=buildFlow(courseId);
  let sum=0;
  flow.forEach(n=>{ const p=state.progress[nodeKey(courseId,n)]; if(p) sum+=p.stars; });
  return sum;
}
function maxStars(courseId){ return buildFlow(courseId).length*3; }
function grandTotalStars(){ return totalStars('math')+totalStars('reading'); }
function defaultFocus(courseId){
  const flow=buildFlow(courseId);
  for(let i=0;i<flow.length;i++){
    if(!nodeCompleted(courseId,flow[i])){
      const n=flow[i];
      return n.type==='exam' ? {type:'exam',exam:n.exam} : {type:'unit',u:n.u};
    }
  }
  return {type:'unit',u:0};
}

/* ---------------------------------------------------------------
   RENDERING
--------------------------------------------------------------- */
const app=document.getElementById('app');
function go(view){ state.view=view; render(); window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('logoBtn').addEventListener('click',()=>go({name:'home'}));

function render(){
  document.getElementById('starCount').textContent=grandTotalStars();
  app.innerHTML='';
  if(state.view.name==='home') app.appendChild(renderHome());
  else if(state.view.name==='course') app.appendChild(renderCoursePage(state.view.courseId));
  else if(state.view.name==='teach') app.appendChild(renderTeach(state.view.courseId,state.view.u,state.view.l));
  else if(state.view.name==='practice') app.appendChild(renderPracticeView());
  else if(state.view.name==='result') app.appendChild(renderResult());
}

function renderCoursePage(courseId){
  const course=COURSES[courseId];
  const accent=courseId==='math'?'math':'read';
  if(!state.courseFocus[courseId]) state.courseFocus[courseId]=defaultFocus(courseId);
  const focus=state.courseFocus[courseId];

  const wrap=el(`<div>
    <div class="course-head" style="padding-bottom:0;">
      <button class="backlink" id="backHome">&larr; All courses</button>
    </div>
    <div class="course-shell"></div>
  </div>`);
  wrap.querySelector('#backHome').addEventListener('click',()=>go({name:'home'}));
  const shell=wrap.querySelector('.course-shell');

  const sidebar=el(`<div class="course-sidebar"></div>`);
  sidebar.appendChild(el(`<div class="sidebar-head">
    <div class="ic" style="background:var(--${accent})">${courseId==='math'?'M':'R'}</div>
    <div class="txt"><strong>${course.name}</strong><span>${course.units.length} units · ${course.units.reduce((s,u)=>s+u.lessons.length,0)} lessons</span></div>
  </div>`));
  const makeExamItem=(examType)=>{
    const active=focus.type==='exam' && focus.exam===examType;
    const item=el(`<button class="side-item exam ${active?'active':''}">
      <div class="si-eyebrow">Checkpoint</div>
      <div class="si-title">🏆 ${EXAM_META[examType].title}</div>
    </button>`);
    item.addEventListener('click',()=>{ state.courseFocus[courseId]={type:'exam',exam:examType}; render(); });
    return item;
  };
  course.units.forEach((unit,ui)=>{
    const active=focus.type==='unit' && focus.u===ui;
    const item=el(`<button class="side-item ${active?'active':''}">
      <div class="si-eyebrow">Unit ${ui+1}</div>
      <div class="si-title">${unit.title}</div>
    </button>`);
    item.addEventListener('click',()=>{ state.courseFocus[courseId]={type:'unit',u:ui}; render(); });
    sidebar.appendChild(item);
    if(ui===2) sidebar.appendChild(makeExamItem('mid'));
    if(ui===3) sidebar.appendChild(makeExamItem('threequarter'));
    if(ui===4) sidebar.appendChild(makeExamItem('final'));
  });
  shell.appendChild(sidebar);

  const main=el(`<div class="course-main"></div>`);
  main.appendChild(focus.type==='unit' ? renderUnitMain(courseId,focus.u) : renderExamMain(courseId,focus.exam));
  shell.appendChild(main);

  return wrap;
}

function renderUnitMain(courseId,ui){
  const course=COURSES[courseId];
  const unit=course.units[ui];
  const accent=courseId==='math'?'math':'read';
  const flow=buildFlow(courseId);
  const maxUnitStars=(unit.lessons.length+1)*3;

  let earned=0;
  unit.lessons.forEach((les,li)=>{ const p=state.progress[nodeKey(courseId,{type:'lesson',u:ui,l:li})]; if(p) earned+=p.stars; });
  const testNode={type:'test',u:ui};
  const testP=state.progress[nodeKey(courseId,testNode)];
  if(testP) earned+=testP.stars;

  const wrap=el(`<div>
    <div class="unit-page-head">
      <p class="eyebrow">Unit ${ui+1} of ${course.units.length}</p>
      <h1>${unit.title}</h1>
      <p class="possible">${earned} / ${maxUnitStars} possible stars</p>
    </div>
    <div class="squares-row"></div>
    <div class="about-unit">
      <h3>About this unit</h3>
      <p>${unit.overview}</p>
      <ul class="objective-list"></ul>
    </div>
    <div class="lessons-list"></div>
  </div>`);

  const squares=wrap.querySelector('.squares-row');
  unit.lessons.forEach((les,li)=>{
    const done=nodeCompleted(courseId,{type:'lesson',u:ui,l:li});
    squares.appendChild(el(`<div class="sq-node ${done?'done':''}">${done?'✓':(li+1)}</div>`));
  });
  const testDone=nodeCompleted(courseId,testNode);
  squares.appendChild(el(`<div class="sq-node star ${testDone?'done':''}">${testDone?'✓':'★'}</div>`));

  const objList=wrap.querySelector('.objective-list');
  unit.objectives.forEach(obj=>{
    objList.appendChild(el(`<li><span class="check-badge" style="background:var(--${accent})">✓</span>${obj}</li>`));
  });

  const list=wrap.querySelector('.lessons-list');
  unit.lessons.forEach((les,li)=>{
    const node={type:'lesson',u:ui,l:li};
    const idx=flowIndexOf(flow,node);
    const unlocked=nodeUnlockedAt(flow,idx,courseId);
    const done=nodeCompleted(courseId,node);
    const p=state.progress[nodeKey(courseId,node)];
    const status = done ? `Best score: ${p.bestCorrect}/5` : (unlocked?'Not started':'Locked');
    const row=el(`<div class="lesson-row ${unlocked?'':'locked'}">
      <div class="lr-icon" style="background:${done?'var(--sun)':'var(--'+accent+')'};${done?'color:#7a5300;':''}">${done?'✓':(li+1)}</div>
      <div class="lr-body">
        <p class="lr-title">${les.title}</p>
        <p class="lr-status">${status}</p>
        ${p?`<div class="lr-stars">${[0,1,2].map(i=>starIcon(i<p.stars)).join('')}</div>`:''}
      </div>
      <div class="lr-action"><button class="btn btn-small ${accent==='math'?'btn-math':'btn-read'}" ${unlocked?'':'disabled'}>${done?'Review':(unlocked?'Start':'Locked')}</button></div>
    </div>`);
    if(unlocked) row.querySelector('button').addEventListener('click',()=>go({name:'teach',courseId,u:ui,l:li}));
    list.appendChild(row);
  });

  {
    const idx=flowIndexOf(flow,testNode);
    const unlocked=nodeUnlockedAt(flow,idx,courseId);
    const status = testDone ? `Best score: ${testP.bestCorrect}/${unit.lessons.length*3}` : (unlocked?'Not started':'Locked — finish all lessons first');
    const row=el(`<div class="lesson-row test ${unlocked?'':'locked'}">
      <div class="lr-icon">★</div>
      <div class="lr-body">
        <p class="lr-title">Unit Test</p>
        <p class="lr-status">${status}</p>
        ${testP?`<div class="lr-stars">${[0,1,2].map(i=>starIcon(i<testP.stars)).join('')}</div>`:''}
      </div>
      <div class="lr-action"><button class="btn btn-small btn-ghost" ${unlocked?'':'disabled'}>${testDone?'Retake test':(unlocked?'Take test':'Locked')}</button></div>
    </div>`);
    if(unlocked) row.querySelector('button').addEventListener('click',()=>startQuiz(courseId,{type:'test',u:ui}));
    list.appendChild(row);
  }
  return wrap;
}

function renderExamMain(courseId,examType){
  const meta=EXAM_META[examType];
  const node={type:'exam',exam:examType};
  const flow=buildFlow(courseId);
  const idx=flowIndexOf(flow,node);
  const unlocked=nodeUnlockedAt(flow,idx,courseId);
  const done=nodeCompleted(courseId,node);
  const p=state.progress[nodeKey(courseId,node)];
  const totalQ=COURSES[courseId].units.slice(0,meta.uptoUnit+1).reduce((s,u)=>s+u.lessons.length,0);
  const wrap=el(`<div>
    <div class="exam-page-card ${unlocked?'':'locked'}">
      <div class="exam-icon-big">🏆</div>
      <h1>${meta.title}</h1>
      <p>${meta.blurb} — ${totalQ} questions</p>
      ${p?`<div class="result-stars" style="margin-bottom:14px;">${[0,1,2].map(i=>starIcon(i<p.stars)).join('')}</div><p style="margin-bottom:18px;">Best score: ${p.bestCorrect}/${totalQ}</p>`:''}
      <button class="btn ${unlocked?(courseId==='math'?'btn-math':'btn-read'):'btn-ghost'}" ${unlocked?'':'disabled'}>${unlocked?(done?'Retake exam':'Start exam'):'Locked — finish the previous unit test first'}</button>
    </div>
  </div>`);
  if(unlocked) wrap.querySelector('button').addEventListener('click',()=>startQuiz(courseId,{type:'exam',exam:examType}));
  return wrap;
}

function renderTeach(courseId,u,l){
  const course=COURSES[courseId];
  const unit=course.units[u];
  const lesson=unit.lessons[l];
  const accent=courseId==='math'?'btn-math':'btn-read';
  const objective=unit.objectives[l];
  const wrap=el(`<div class="lesson-card">
    <button class="backlink" id="backCourse">&larr; ${unit.title}</button>
    <div class="teach-box">
      <p class="lesson-meta">Unit ${u+1} • Lesson ${l+1} of ${unit.lessons.length}</p>
      <h2>${lesson.title}</h2>
      <div class="lesson-objective"><b>Objective:</b> By the end of this lesson, you'll be able to ${objective.charAt(0).toLowerCase()+objective.slice(1)}.</div>
      <p class="teach-text">${lesson.teach}</p>
      <div class="example-box"><b>Example:</b> ${lesson.example}</div>
      <div class="btn-row" style="margin-top:22px;">
        <button class="btn ${accent}" id="startPractice">Start practice</button>
      </div>
    </div>
  </div>`);
  wrap.querySelector('#backCourse').addEventListener('click',()=>{ state.courseFocus[courseId]={type:'unit',u}; go({name:'course',courseId}); });
  wrap.querySelector('#startPractice').addEventListener('click',()=>startQuiz(courseId,{type:'lesson',u,l}));
  return wrap;
}

function startQuiz(courseId,target){
  let questions,title,node;
  if(target.type==='lesson'){
    const lesson=COURSES[courseId].units[target.u].lessons[target.l];
    questions=lesson.gen(5);
    node={type:'lesson',u:target.u,l:target.l};
    title=lesson.title;
  } else if(target.type==='test'){
    questions=genUnitTest(courseId,target.u);
    node={type:'test',u:target.u};
    title=`${COURSES[courseId].units[target.u].title} — Unit Test`;
  } else {
    const meta=EXAM_META[target.exam];
    questions=genExam(courseId,meta.uptoUnit);
    node={type:'exam',exam:target.exam};
    title=meta.title;
  }
  state.practice={courseId,node,title,questions,idx:0,answers:[],locked:false};
  go({name:'practice'});
}

const ENCOURAGE_GOOD=["Nice work!","You've got it!","Excellent!","Great thinking!","That's right!"];
const ENCOURAGE_BAD=["Not quite — let's keep going.","Close! Here's the right answer.","Good try — check this out.","Almost! Let's learn from this one."];

function renderPracticeView(){
  const pr=state.practice;
  const q=pr.questions[pr.idx];
  const accent=pr.courseId==='math'?'math':'read';
  const wrap=el(`<div class="practice-wrap">
    <button class="backlink" id="backLink">&larr; ${pr.title}</button>
    <div class="progress-dots"></div>
    <div class="q-card">
      ${q.passage?`<div class="q-passage">${esc(q.passage)}</div>`:''}
      <p class="q-prompt">${esc(q.prompt)}</p>
      ${q.visual?`<div class="q-visual">${q.visual}</div>`:''}
      <div class="choices"></div>
      <div id="feedbackSlot"></div>
    </div>
  </div>`);
  wrap.querySelector('#backLink').addEventListener('click',()=>{
    if(pr.node.type==='lesson') go({name:'teach',courseId:pr.courseId,u:pr.node.u,l:pr.node.l});
    else {
      state.courseFocus[pr.courseId] = pr.node.type==='test' ? {type:'unit',u:pr.node.u} : {type:'exam',exam:pr.node.exam};
      go({name:'course',courseId:pr.courseId});
    }
  });

  const dotsWrap=wrap.querySelector('.progress-dots');
  pr.questions.forEach((_,i)=>{
    let cls='dot';
    if(pr.answers[i]===true) cls+=' done-correct';
    else if(pr.answers[i]===false) cls+=' done-wrong';
    else if(i===pr.idx) cls+=' current';
    dotsWrap.appendChild(el(`<div class="${cls}"></div>`));
  });

  const choicesWrap=wrap.querySelector('.choices');
  q.choices.forEach(choice=>{
    const btn=el(`<button class="choice-btn">${esc(choice.label)}</button>`);
    btn.addEventListener('click',()=>selectAnswer(choice,q,choicesWrap,wrap));
    choicesWrap.appendChild(btn);
  });
  return wrap;
}

function selectAnswer(choice,q,choicesWrap,wrap){
  if(state.practice.locked) return;
  state.practice.locked=true;
  const buttons=[...choicesWrap.children];
  buttons.forEach(b=>b.disabled=true);
  q.choices.forEach((c,i)=>{
    if(c.correct) buttons[i].classList.add('correct');
    if(c===choice && !c.correct) buttons[i].classList.add('wrong');
  });
  state.practice.answers[state.practice.idx]=choice.correct;
  const feedbackSlot=wrap.querySelector('#feedbackSlot');
  const good=choice.correct;
  feedbackSlot.appendChild(el(`<div class="feedback-bar ${good?'good':'bad'}">
    <div class="mascot">${mascotSVG(good?'happy':'sad')}</div>
    <span>${good?pick(ENCOURAGE_GOOD):pick(ENCOURAGE_BAD)}</span>
  </div>`));
  const isLast = state.practice.idx===state.practice.questions.length-1;
  const footer=el(`<div class="practice-footer"><button class="btn ${state.practice.courseId==='math'?'btn-math':'btn-read'}">${isLast?'See results':'Next question'}</button></div>`);
  footer.querySelector('button').addEventListener('click',()=>{
    if(isLast){ finishQuiz(); }
    else { state.practice.idx++; state.practice.locked=false; render(); }
  });
  wrap.querySelector('.q-card').appendChild(footer);
}

function finishQuiz(){
  const pr=state.practice;
  const correctCount=pr.answers.filter(a=>a===true).length;
  const total=pr.questions.length;
  const stars=starsForScore(correctCount,total);
  const key=nodeKey(pr.courseId,pr.node);
  const prev=state.progress[key];
  if(!prev || stars>prev.stars) state.progress[key]={stars,bestCorrect:correctCount};
  state.lastResult={courseId:pr.courseId,node:pr.node,title:pr.title,correctCount,stars,total};
  go({name:'result'});
}

function renderResult(){
  const r=state.lastResult;
  const courseId=r.courseId;
  const accent=courseId==='math'?'math':'read';
  const passed=r.stars>0;
  const flow=buildFlow(courseId);
  const idx=flowIndexOf(flow,r.node);
  const nextNode=flow[idx+1];
  let nextLabel=null,nextAction=null;
  if(nextNode){
    if(nextNode.type==='lesson'){ nextLabel='Next lesson'; nextAction=()=>go({name:'teach',courseId,u:nextNode.u,l:nextNode.l}); }
    else if(nextNode.type==='test'){ nextLabel='Go to Unit Test'; nextAction=()=>{ state.courseFocus[courseId]={type:'unit',u:nextNode.u}; go({name:'course',courseId}); }; }
    else { nextLabel=`Go to ${EXAM_META[nextNode.exam].title}`; nextAction=()=>{ state.courseFocus[courseId]={type:'exam',exam:nextNode.exam}; go({name:'course',courseId}); }; }
  }
  const wrap=el(`<div class="result-wrap">
    <div style="width:70px;height:70px;margin:0 auto;">${mascotSVG(passed?'happy':'neutral')}</div>
    <h2 class="result-title">${passed?'Nice work!':'Keep practicing!'}</h2>
    <p class="result-sub">${r.title} — you got ${r.correctCount} out of ${r.total} correct.</p>
    <div class="result-stars">${[0,1,2].map(i=>starIcon(i<r.stars)).join('')}</div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-ghost" id="retry">Try again</button>
      ${nextNode?`<button class="btn ${accent==='math'?'btn-math':'btn-read'}" id="nextBtn">${nextLabel}</button>`:''}
      <button class="btn btn-leaf" id="toUnit">Back to unit</button>
    </div>
  </div>`);
  wrap.querySelector('#retry').addEventListener('click',()=>{
    if(r.node.type==='lesson') startQuiz(courseId,{type:'lesson',u:r.node.u,l:r.node.l});
    else if(r.node.type==='test') startQuiz(courseId,{type:'test',u:r.node.u});
    else startQuiz(courseId,{type:'exam',exam:r.node.exam});
  });
  wrap.querySelector('#toUnit').addEventListener('click',()=>{
    state.courseFocus[courseId] = r.node.type==='exam' ? {type:'exam',exam:r.node.exam} : {type:'unit',u:r.node.u};
    go({name:'course',courseId});
  });
  const nb=wrap.querySelector('#nextBtn');
  if(nb) nb.addEventListener('click',nextAction);
  return wrap;
}

render();
</script>
